<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA Nights Championship League Draw V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: #0a0e27;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.8s ease;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00ff87 0%, #60efff 100%);
            z-index: 1000;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
            padding-bottom: 100px;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            animation: titleGlow 2s ease-in-out infinite;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff87, #60efff, transparent);
        }

        .subtitle {
            font-size: 1.3em;
            margin-bottom: 50px;
            opacity: 0.85;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: subtitlePulse 3s ease-in-out infinite;
        }

        .opening-stage {
            position: relative;
        }

        .spotlight {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            pointer-events: none;
            animation: spotlightSweep 8s ease-in-out infinite;
            z-index: 0;
        }

        .spotlight:nth-child(2) {
            animation-delay: 2s;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: particleFloat 6s ease-in-out infinite;
        }

        /* NEWS TICKER BAR */
        .news-ticker {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(10, 14, 39, 0.98);
            border-top: 3px solid;
            border-image: linear-gradient(90deg, #00ff87, #60efff) 1;
            overflow: hidden;
            z-index: 100;
            display: none;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .news-ticker.active {
            display: block;
        }

        .ticker-label {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 150px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.9em;
            color: #0a0e27;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 101;
        }

        .ticker-content-wrapper {
            position: absolute;
            left: 150px;
            right: 0;
            top: 0;
            bottom: 0;
            overflow: hidden;
        }

        .ticker-content {
            display: flex;
            animation: tickerScroll 60s linear infinite;
            white-space: nowrap;
        }

        .ticker-item {
            display: inline-flex;
            align-items: center;
            padding: 0 30px;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .ticker-ball {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 255, 135, 0.3), rgba(96, 239, 255, 0.3));
            border: 2px solid rgba(0, 255, 135, 0.6);
            margin-right: 10px;
            font-weight: 900;
            font-size: 0.9em;
            color: #00ff87;
        }

        .ticker-team {
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
        }

        .ticker-separator {
            margin: 0 15px;
            color: rgba(0, 255, 135, 0.5);
            font-size: 1.5em;
        }

        @keyframes tickerScroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* BALL CHAMBER */
        .ball-chamber {
            position: relative;
            width: 600px;
            height: 400px;
            margin: 40px auto;
            display: none;
            background: radial-gradient(circle at center, rgba(96, 239, 255, 0.05) 0%, transparent 70%);
            border-radius: 20px;
            border: 3px solid rgba(0, 255, 135, 0.3);
            box-shadow:
                0 0 60px rgba(0, 255, 135, 0.2),
                inset 0 0 100px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .ball-chamber.active {
            display: block;
        }

        .ball-chamber::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .ball {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(96, 239, 255, 0.4));
            border: 2px solid rgba(0, 255, 135, 0.6);
            box-shadow:
                0 4px 15px rgba(0, 255, 135, 0.4),
                inset -5px -5px 10px rgba(0, 0, 0, 0.3),
                inset 5px 5px 10px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.3em;
            color: #0a0e27;
            cursor: default;
            animation: ballFloat 3s ease-in-out infinite;
        }

        .ball.selected {
            animation: ballZoom 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes ballFloat {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -15px) rotate(90deg);
            }
            50% {
                transform: translate(-10px, -10px) rotate(180deg);
            }
            75% {
                transform: translate(-15px, 10px) rotate(270deg);
            }
        }

        @keyframes ballZoom {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            50% {
                transform: scale(3) translate(0, -50px);
                opacity: 1;
            }
            100% {
                transform: scale(5) translate(0, -100px);
                opacity: 0;
            }
        }

        .player-info {
            font-size: 2em;
            font-weight: 700;
            margin: 20px 0;
            padding: 20px 40px;
            background: linear-gradient(135deg, rgba(0, 255, 135, 0.1) 0%, rgba(96, 239, 255, 0.1) 100%);
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 135, 0.3);
            display: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0, 255, 135, 0.2);
        }

        .player-info.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .team-result {
            font-size: 4em;
            font-weight: 900;
            margin: 40px 0;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 3px solid rgba(0, 255, 135, 0.5);
            display: none;
            animation: zoomIn 0.8s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow:
                0 0 40px rgba(0, 255, 135, 0.3),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
        }

        .team-result.show {
            display: block;
        }

        .draws-summary {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0, 255, 135, 0.05) 0%, rgba(96, 239, 255, 0.05) 100%);
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 135, 0.2);
            font-size: 1.2em;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .draws-summary h2 {
            font-size: 1.8em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .draw-item {
            margin: 15px 0;
            padding: 15px 20px;
            background: rgba(0, 255, 135, 0.05);
            border-radius: 10px;
            border-left: 4px solid #00ff87;
            font-weight: 600;
            letter-spacing: 1px;
        }

        button {
            font-size: 1.3em;
            font-weight: 700;
            padding: 18px 60px;
            margin: 20px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            color: #0a0e27;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 4px 20px rgba(0, 255, 135, 0.4),
                0 0 40px rgba(96, 239, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 6px 30px rgba(0, 255, 135, 0.6),
                0 0 60px rgba(96, 239, 255, 0.4);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 10px rgba(0, 255, 135, 0.2);
        }

        .status {
            margin: 20px 0;
            font-size: 1.2em;
            min-height: 30px;
            opacity: 0.85;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .audio-indicator {
            display: none;
            margin: 20px 0;
            font-size: 1.1em;
            padding: 10px 25px;
            background: rgba(0, 255, 135, 0.1);
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 135, 0.3);
            display: inline-block;
            opacity: 0;
        }

        .audio-indicator.playing {
            opacity: 1;
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes titleGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 135, 0.4));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(96, 239, 255, 0.6));
                transform: scale(1.01);
            }
        }

        @keyframes subtitlePulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        @keyframes spotlightSweep {
            0%, 100% {
                left: 0%;
                top: 20%;
            }
            25% {
                left: 70%;
                top: 10%;
            }
            50% {
                left: 80%;
                top: 60%;
            }
            75% {
                left: 20%;
                top: 70%;
            }
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) translateX(100px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="spotlight"></div>
    <div class="spotlight"></div>

    <!-- NEWS TICKER -->
    <div class="news-ticker" id="newsTicker">
        <div class="ticker-label">TEAM LIST</div>
        <div class="ticker-content-wrapper">
            <div class="ticker-content" id="tickerContent"></div>
        </div>
    </div>

    <div class="container">
        <div class="opening-stage" id="openingStage">
            <h1>FIFA NIGHTS TV</h1>
            <div class="subtitle">Championship League Draw Live</div>
        </div>

        <div class="status" id="status"></div>
        <div class="audio-indicator" id="audioIndicator">🔊 Commentary playing...</div>

        <button id="startBtn" onclick="startDraw()">Start Draw</button>
        <button id="drawBtn" onclick="performDraw()" style="display:none;" disabled>Draw Team</button>

        <div class="player-info" id="playerInfo"></div>

        <!-- BALL CHAMBER -->
        <div class="ball-chamber" id="ballChamber"></div>

        <div class="team-result" id="teamResult"></div>

        <div class="draws-summary" id="drawsSummary" style="display:none;">
            <h2>Draw Results</h2>
            <div id="drawsList"></div>
        </div>
    </div>

    <script>
        // Team data with ball numbers
        const TEAMS_LIST = [
            'Stoke City',
            'West Bromwich Albion',
            'Bristol City',
            'Leicester City',
            'Preston North End',
            'Swansea City',
            'Charlton Athletic',
            'Queens Park Rangers',
            'Birmingham City',
            'Millwall',
            'Ipswich Town',
            'Southampton',
            'Wrexham',
            'Watford',
            'Portsmouth',
            'Hull City',
            'Norwich City',
            'Derby County'
        ];

        const TEAMS_DATA = {
            'Stoke City': { primary: '#E03A3E', secondary: '#FFFFFF' },
            'West Bromwich Albion': { primary: '#122F67', secondary: '#FFFFFF' },
            'Bristol City': { primary: '#E4002B', secondary: '#FFFFFF' },
            'Leicester City': { primary: '#003090', secondary: '#FDBE11' },
            'Preston North End': { primary: '#FFFFFF', secondary: '#001489' },
            'Swansea City': { primary: '#000000', secondary: '#FFFFFF' },
            'Charlton Athletic': { primary: '#D4021D', secondary: '#FFFFFF' },
            'Queens Park Rangers': { primary: '#1D5BA4', secondary: '#FFFFFF' },
            'Birmingham City': { primary: '#0033A0', secondary: '#FFFFFF' },
            'Millwall': { primary: '#002D62', secondary: '#FFFFFF' },
            'Ipswich Town': { primary: '#0033A0', secondary: '#FFFFFF' },
            'Southampton': { primary: '#D71920', secondary: '#130C0E' },
            'Wrexham': { primary: '#EE2737', secondary: '#FFFFFF' },
            'Watford': { primary: '#FBEE23', secondary: '#ED2127' },
            'Portsmouth': { primary: '#001489', secondary: '#FFFFFF' },
            'Hull City': { primary: '#F5A12D', secondary: '#000000' },
            'Norwich City': { primary: '#00A650', secondary: '#FFF200' },
            'Derby County': { primary: '#FFFFFF', secondary: '#000000' }
        };

        // API Configuration
        const GROQ_API_KEY = 'YOUR_GROQ_API_KEY_HERE';
        const ELEVENLABS_API_KEY = 'YOUR_ELEVENLABS_API_KEY_HERE';
        const ELEVENLABS_VOICE_ID = 'wV4HYsYQoBFN089GpaS9';

        // Draw state
        let availableBalls = [...Array(18).keys()].map(i => i + 1);
        let currentPlayerIndex = 0;
        const players = ['Josh', 'Martin', 'Paul'];
        let drawResults = [];
        let isDrawing = false;
        let conversationHistory = [
            {
                role: "system",
                content: "You are a TV broadcast commentator for FIFA Nights TV"
            }
        ];

        // Initialize news ticker
        function initTicker() {
            const tickerContent = document.getElementById('tickerContent');
            let tickerHTML = '';

            // Create ticker items (duplicate for seamless loop)
            for (let loop = 0; loop < 2; loop++) {
                TEAMS_LIST.forEach((team, index) => {
                    tickerHTML += `
                        <div class="ticker-item">
                            <div class="ticker-ball">${index + 1}</div>
                            <div class="ticker-team">${team}</div>
                            <span class="ticker-separator">|</span>
                        </div>
                    `;
                });
            }

            tickerContent.innerHTML = tickerHTML;
        }

        // Initialize ball chamber
        function initBalls() {
            const chamber = document.getElementById('ballChamber');
            chamber.innerHTML = '';

            availableBalls.forEach((ballNum) => {
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.textContent = ballNum;
                ball.dataset.ballNumber = ballNum;

                // Random starting position
                const x = Math.random() * 500 + 50;
                const y = Math.random() * 300 + 50;
                ball.style.left = `${x}px`;
                ball.style.top = `${y}px`;

                // Random animation delay and duration
                ball.style.animationDelay = `${Math.random() * 3}s`;
                ball.style.animationDuration = `${2 + Math.random() * 2}s`;

                chamber.appendChild(ball);
            });
        }

        // Generate commentary using Groq
        async function generateCommentary(prompt, maxTokens = 80) {
            conversationHistory.push({
                role: "user",
                content: prompt
            });

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: conversationHistory,
                        temperature: 0.8,
                        max_tokens: maxTokens,
                        top_p: 0.9
                    })
                });

                const data = await response.json();
                const commentary = data.choices[0].message.content;

                conversationHistory.push({
                    role: "assistant",
                    content: commentary
                });

                return commentary;
            } catch (error) {
                console.error('Groq API error:', error);
                return "Welcome to the FIFA Nights Championship League Draw!";
            }
        }

        // Track current audio
        let currentAudio = null;

        // Play commentary using ElevenLabs
        async function playCommentary(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const audioIndicator = document.getElementById('audioIndicator');
            audioIndicator.classList.add('playing');

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}/stream`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': ELEVENLABS_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: 'eleven_multilingual_v2',
                        voice_settings: {
                            stability: 0.5,
                            similarity_boost: 0.75,
                            speed: 1.1
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('ElevenLabs API error');
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                currentAudio = audio;

                return new Promise((resolve) => {
                    audio.onended = () => {
                        audioIndicator.classList.remove('playing');
                        URL.revokeObjectURL(audioUrl);
                        currentAudio = null;
                        resolve();
                    };
                    audio.onerror = () => {
                        audioIndicator.classList.remove('playing');
                        currentAudio = null;
                        resolve();
                    };
                    audio.play().catch(() => {
                        audioIndicator.classList.remove('playing');
                        currentAudio = null;
                        resolve();
                    });
                });
            } catch (error) {
                console.error('Audio playback error:', error);
                audioIndicator.classList.remove('playing');
                currentAudio = null;
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }

        // Start the draw
        async function startDraw() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('status').textContent = 'Initializing draw...';

            // Generate and play opening commentary
            const openingPrompt = "You are presenting the opening of the FIFA Nights Championship League Draw Live! Josh, Martin, and Paul will each draw a team to play as in the upcoming FIFA tournament. Build REAL excitement and drama with enthusiasm! You have 3-4 sentences to hype this up (around 50 words). ONLY REPLY WITH THE WORDS SPOKEN BY YOU. NO NOTATION! NO DIRECTION. JUST THE WORDS YOU SAY ALOUD.";
            const opening = await generateCommentary(openingPrompt, 200);

            await playCommentary(opening);

            // Show ticker, draw button and ball chamber
            document.getElementById('newsTicker').classList.add('active');
            document.getElementById('drawBtn').style.display = 'inline-block';
            document.getElementById('drawBtn').disabled = false;
            document.getElementById('ballChamber').classList.add('active');
            document.getElementById('drawsSummary').style.display = 'block';

            initBalls();
            showCurrentPlayer();
        }

        // Show current player
        function showCurrentPlayer() {
            const playerInfo = document.getElementById('playerInfo');
            const currentPlayer = players[currentPlayerIndex];
            playerInfo.textContent = `${currentPlayer}'s Turn`;
            playerInfo.classList.add('active');
            document.getElementById('status').textContent = `${currentPlayer} is up next!`;
        }

        // Perform draw
        async function performDraw() {
            if (isDrawing || availableBalls.length === 0) return;

            isDrawing = true;
            document.getElementById('drawBtn').disabled = true;
            document.getElementById('teamResult').classList.remove('show');

            const currentPlayer = players[currentPlayerIndex];

            // Generate commentary
            const spinPrompt = `${currentPlayer} is about to draw! The balls are mixing! Build quick tension and anticipation. Keep it brief - maximum 50 words total, 2-3 sentences. ONLY REPLY WITH THE WORDS SPOKEN BY YOU. NO NOTATION!`;
            const spinCommentary = await generateCommentary(spinPrompt, 80);

            // Play commentary
            const commentaryPromise = playCommentary(spinCommentary);

            // Wait for both commentary and mixing time
            const mixTime = 8000;
            await Promise.all([
                commentaryPromise,
                new Promise(resolve => setTimeout(resolve, mixTime))
            ]);

            // Select random ball
            const randomIndex = Math.floor(Math.random() * availableBalls.length);
            const drawnBallNumber = availableBalls[randomIndex];
            const drawnTeam = TEAMS_LIST[drawnBallNumber - 1];

            // Animate ball selection
            const balls = document.querySelectorAll('.ball');
            const selectedBall = Array.from(balls).find(b => parseInt(b.dataset.ballNumber) === drawnBallNumber);
            if (selectedBall) {
                selectedBall.classList.add('selected');
            }

            await new Promise(resolve => setTimeout(resolve, 1500));

            // Show result
            showTeamResult(drawnTeam, currentPlayer, drawnBallNumber);

            // Generate landing commentary
            const landingPrompt = `${currentPlayer} drew ball ${drawnBallNumber}, that's ${drawnTeam}! React with enthusiasm and make a fun comment about the team and how it suits ${currentPlayer}. Keep it to 2-3 sentences (around 40 words max). ONLY REPLY WITH THE WORDS SPOKEN BY YOU. NO NOTATION!`;
            const landingCommentary = await generateCommentary(landingPrompt, 100);

            await playCommentary(landingCommentary);

            // Update state
            drawResults.push({ player: currentPlayer, team: drawnTeam, ballNumber: drawnBallNumber });
            availableBalls = availableBalls.filter(b => b !== drawnBallNumber);

            // Update draws list
            updateDrawsList();

            // Move to next player or finish
            currentPlayerIndex++;

            if (currentPlayerIndex < players.length) {
                initBalls();
                showCurrentPlayer();
                document.getElementById('drawBtn').disabled = false;
                isDrawing = false;
            } else {
                await finishDraw();
            }
        }

        // Show team result
        function showTeamResult(team, player, ballNum) {
            const colors = TEAMS_DATA[team];
            const resultDiv = document.getElementById('teamResult');

            document.body.style.background = `linear-gradient(135deg, ${colors.primary} 0%, ${colors.secondary} 100%)`;

            resultDiv.innerHTML = `<div style="font-size:0.5em; opacity:0.7;">BALL ${ballNum}</div>${team}`;
            resultDiv.style.background = `linear-gradient(135deg, ${colors.primary} 20%, ${colors.secondary} 80%)`;
            resultDiv.style.border = `5px solid ${colors.secondary}`;
            resultDiv.classList.add('show');
        }

        // Update draws list
        function updateDrawsList() {
            const drawsList = document.getElementById('drawsList');
            drawsList.innerHTML = drawResults.map(draw =>
                `<div class="draw-item">${draw.player} → Ball ${draw.ballNumber} → ${draw.team}</div>`
            ).join('');
        }

        // Finish draw
        async function finishDraw() {
            document.getElementById('drawBtn').style.display = 'none';
            document.getElementById('ballChamber').classList.remove('active');
            document.getElementById('playerInfo').classList.remove('active');

            const summary = drawResults.map(d => `${d.player} got ${d.team}`).join(', ');
            const closingPrompt = `The FIFA Nights Championship League Draw is complete! Here are the final results: ${summary}. Give an exciting wrap-up with 3-4 sentences (around 60 words) and sign off with "and now, back to the studio!" ONLY REPLY WITH THE WORDS SPOKEN BY YOU. NO NOTATION!`;

            const closingCommentary = await generateCommentary(closingPrompt, 250);
            await playCommentary(closingCommentary);

            document.getElementById('status').textContent = 'Draw complete!';

            // Reset background
            setTimeout(() => {
                document.body.style.background = 'linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%)';
            }, 3000);
        }

        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 6}s`;
                particle.style.animationDuration = `${4 + Math.random() * 4}s`;
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize on load
        window.onload = () => {
            console.log('FIFA Nights Draw V2 initialized');
            console.log(`${TEAMS_LIST.length} teams loaded`);
            createParticles();
            initTicker();
        };
    </script>
</body>
</html>
